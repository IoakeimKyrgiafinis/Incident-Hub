name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "deploy to dev here"   # host-specific step

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production   # pauses here until you approve
    steps:
      - run: echo "deploy to prod here"  # host-specific step