apiVersion: 1
contactPoints:
  - orgId: 1
    name: oncall-agent
    receivers:
      - uid: oncall-agent-webhook
        type: webhook
        settings:
          url: http://oncall-agent:9000/alert
          httpMethod: POST
policies:
  - orgId: 1
    receiver: oncall-agent
    group_by: ["alertname"]
    group_wait: 10s
    repeat_interval: 1h